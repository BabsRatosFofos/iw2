<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>frontend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    input,
    button,
    select {
      margin: 5px;
      padding: 6px;
    }
  </style>
</head>
  <body>
   
     <h1>Gerenciamento de Produtos</h1>

    <div>
      <input type="hidden" id="id">
      <input type="text" id="produto" placeholder="Produto">
      <input type="text" id="preço" placeholder="Preço">
      <select id="ativo">
        <option value="1">Ativo</option>
        <option value="0">Inativo</option>
      </select>
      <button onclick="salvar()">Salvar</button>
      <button onclick="limpar()">Cancelar</button>
    </div>

    <div>
      <input type="text" id="pesquisa" placeholder="Pesquisar por produto ou preço">
      <button onclick="carregarPesquisa()">Pesquisar</button>
      <button onclick="carregar()">Listar todos</button>
    </div>

    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Produtos</h5>
      </div>
      <div class="card-body">

    <table id="tabela" class="table table-striped table-hover">
      <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Produto</th>
          <th>Preço</th>
          <th>Ativo</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script>

        const API_URL = "http://localhost/api/usuarios.php";

        function carregar(pesquisa = "") {
            const tbody = document.querySelector("#tabela tbody");
            tbody.innerHTML = "";

            let url = API_URL;
            if (pesquisa) {
                url += "?pesquisa=" + encodeURIComponent(pesquisa);
            }
            fetch(url)
               .then(resposta => resposta.json())
               .then(dados => {
                console.log(dados);
                dados.forEach(produto => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                                    <td>${produto.ID}</td>
                                    <td>${produto.PRODUTO}</td>
                                    <td>${produto.PREÇO}</td>
                                    <td>${produto.ATIVO == 1 ? "Sim" : "Não"}</td>
                                    <td>
                                        <button onclick='editar(${JSON.stringify(produto)})' class="btn btn-light">Editar</button>
                                        <button onclick='excluir(${produto.ID})' class="btn btn-danger">Excluir</button>
                                    </td>
                                    `;
                    tbody.appendChild(tr);
                });
               })
               .catch(error => console.error("Erro ao carregar dados:", error));
        }

        function carregarPesquisa() {
            const valor = document.getElementById("pesquisa").value;
            carregar(valor);
        }

        async function salvar() {
            const id = document.getElementById("id").value;
            const produto = document.getElementById("produto").value;
            const preço = document.getElementById("preço").value;
            const ativo = document.getElementById("ativo").value;
            
            const payload = { ID: id, PRODUTO: produto, PREÇO: preço, ATIVO: ativo };

            try {
                if (id) {
                    await fetch(API_URL, { method: "PUT", body: JSON.stringify(payload) });
                } else {
                    await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
                }

                limpar();
                carregar();
            } catch (error) {
                console.error("Erro ao salvar dados:", error);
            }
        }

        function editar(produto) {
            document.getElementById("id").value = produto.ID;
            document.getElementById("produto").value = produto.PRODUTO;
            document.getElementById("preço").value = produto.PREÇO;
            document.getElementById("ativo").value = produto.ATIVO;
        }

        async function excluir(id) {
            if (confirm("Tem certeza que deseja excluir este produto?")) {
                try {
                    await fetch(API_URL + "?id=" + id, { method: "DELETE" });
                    carregar();
                } catch (error) {
                    console.error("Erro ao excluir produto:", error);
                }
            }
        }

        function limpar() {
            document.getElementById("id").value = "";
            document.getElementById("produto").value = "";
            document.getElementById("preço").value = "";
            document.getElementById("ativo").value = "1";
        }

        carregar();

    </script>
  </body>
</html>
